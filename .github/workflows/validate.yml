name: Validate

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

env:
  TEST_TAG: ${{ github.repository }}:test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-validate
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: aube ci
      - run: aube run lint

  type-check:
    runs-on: ubuntu-latest
    name: Type Check
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: aube ci
      - run: aube run type-check

  unit_test:
    runs-on: ubuntu-latest
    name: Unit Test
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: aube ci
      - run: aube run test:unit-test

  integration_test:
    runs-on: ubuntu-latest
    name: Integration Test
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: aube ci
      - run: aube run test:integration-test

  smoke_test:
    runs-on: ubuntu-latest
    name: Smoke test
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: aube ci
      - run: scripts/local-smoke-test.sh

  docker_test:
    runs-on: ubuntu-latest
    name: Smoke test on Docker container
    timeout-minutes: 5
    needs: smoke_test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: ${{ env.TEST_TAG }}
          cache-from: type=gha,scope=global
          cache-to: type=gha,mode=max,scope=global

      - name: Get a free port
        run: echo "PORT=$(scripts/get-free-port.sh)" >> $GITHUB_ENV

      - name: Start the Docker container
        run: docker run -d --rm --name test-container -p ${{ env.PORT }}:9229 ${{ env.TEST_TAG }}

      - name: Test
        run: scripts/smoke-test.sh
        env:
          PORT: ${{ env.PORT }}

      - name: Stop the Docker container
        run: docker stop test-container
