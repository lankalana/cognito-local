name: Update Dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 1 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    name: Update Dependencies
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4

      - run: aube run auto-upgrade

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update dependencies
          title: Update dependencies
          body: Automated `aubx npm-check-updates -u` + `aube upgrade`.
          branch: update-deps
          delete-branch: true
